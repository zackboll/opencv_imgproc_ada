name: Ada API Documentation

on:
  # Every pull request, including stacked documentation PRs whose base is
  # another feature branch. Pull-request runs never receive Pages permissions.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main publication; cancel superseded runs before they can deploy.
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      deployments: read
    defaults:
      run:
        working-directory: imgproc
    steps:
      - name: Checkout Imgproc
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Inventory regression compares full profiles to the immutable
          # pre-feature source, not merely the current declaration counts.
          fetch-depth: 0
          path: imgproc
      # Indexed-release source snapshot for helper controls and identity audit.
      # Production builds resolve Core from the community index without pins.
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: f8aef00c5366b4275ccd3d934f9c73ea5b83cd4f
          path: core
      - name: Record checkout identities
        run: |
          echo "Imgproc: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libopencv-dev pkg-config unzip python3
      - name: Install Alire 2.1.1
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
      - name: Select qualified compiler and project tools
        run: |
          alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          alr toolchain
      - name: Install qualified documentation-only Markdown renderer
        run: |
          python3 scripts/install_released_gnatdoc.py --venv "$RUNNER_TEMP/enhancer-0.1.1" --with-guides > "$RUNNER_TEMP/enhancer-install.json"
          python3 scripts/install_released_gnatdoc.py --venv "$RUNNER_TEMP/enhancer-0.1.1" --verify > "$RUNNER_TEMP/enhancer-recheck.json"
          diff "$RUNNER_TEMP/enhancer-install.json" "$RUNNER_TEMP/enhancer-recheck.json"
          echo "GNATDOC_ENHANCER_VENV=$RUNNER_TEMP/enhancer-0.1.1" >> "$GITHUB_ENV"
          echo "DOC_PYTHON=$RUNNER_TEMP/enhancer-0.1.1/bin/python" >> "$GITHUB_ENV"
      - name: Qualify released archive and current publication controls
        run: |
          RELEASE_TEST_VENV="$GNATDOC_ENHANCER_VENV" "$DOC_PYTHON" -m unittest discover -s scripts -p test_released_gnatdoc.py -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p test_current_core.py -v
      - name: Test warning comparison
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_compare_gnatdoc_warnings.py'' -v'
      - name: Test documentation validator
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_validate_docs.py'' -v'
      - name: Test documentation coverage and comment-only checks
        run: |
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_check_doc_coverage.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_check_comment_only.py' -v
      - name: Test type links, theme and Ada highlighting
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_link_gnatdoc_types.py'' -v'
      - name: Generate and validate public API and guides
        run: sh scripts/generate_docs.sh
      - name: Record resolved indexed Core source for comparison helpers
        run: |
          echo "DOC_CORE_SOURCE=$(alr exec -- printenv OPENCV_CORE_ALIRE_PREFIX)" >> "$GITHUB_ENV"
      - name: Independently qualify pinned current Core deployment and all hosted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C ../core fetch origin 33a2a4f3b83606a5c779b8a93abeb6c91fa49a21
          (cd ../core && alr -n build)
          mkdir -p "$RUNNER_TEMP/core-native/api"
          (cd ../core && alr exec -- "$GITHUB_WORKSPACE/imgproc/.doc-tools/gnatdoc-26.0.0/bin/gnatdoc" -P docs_api.gpr --backend html --generate public --style leading --warnings -O "$RUNNER_TEMP/core-native/api")
          "$DOC_PYTHON" scripts/qualify_current_core.py --core "$GITHUB_WORKSPACE/core" --native "$RUNNER_TEMP/core-native" --output "$RUNNER_TEMP/core-qualified"
      - name: Generate explicit legacy review oracle and classify every final file
        run: |
          "$DOC_PYTHON" scripts/review_legacy_docs.py --native obj/docs/native --output "$RUNNER_TEMP/legacy-oracle" --core "$DOC_CORE_SOURCE"
          echo "DOC_LEGACY_ORACLE=$RUNNER_TEMP/legacy-oracle" >> "$GITHUB_ENV"
          "$DOC_PYTHON" scripts/compare_production_docs.py --native obj/docs/native --legacy "$RUNNER_TEMP/legacy-oracle" --shared _site --core "$DOC_CORE_SOURCE" --report obj/docs/production-parity.json
      - name: Qualify generated site against validator, coverage, navigation and guide mutations
        run: |
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_validate_docs.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_check_doc_coverage.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_gnatdoc_navigation.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_gnatdoc_guides.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_gnatdoc_examples.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_verify_live_docs.py' -v
          "$DOC_PYTHON" -m unittest discover -s scripts -p 'test_shared_production.py' -v
      - name: Qualify deterministic fresh generation and idempotent enhancement
        run: |
          cp -a _site /tmp/documentation-first
          sh scripts/generate_docs.sh
          diff -r /tmp/documentation-first _site
          "$DOC_PYTHON" scripts/verify_shared_repeat.py
          diff -r /tmp/documentation-first _site
          DOC_ISOLATED_TEST=1 "$DOC_PYTHON" -m unittest discover -s scripts -p test_isolated_docs.py -v
      - name: Compile and run the landing-page and guide examples
        run: |
          alr exec -- gprbuild -P docs/example.gpr
          obj/docs-example/example
          alr exec -- gprbuild -P docs/examples/examples.gpr
          for example in filtering_and_transforms color_and_representation \
              features_and_analysis segmentation_and_contours matching_and_registration; do
            "obj/docs-examples/$example"
          done
      - name: Qualify linked examples in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/doc-browser" playwright@1.64.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/doc-browser/node_modules/playwright"
          "$RUNNER_TEMP/doc-browser/node_modules/.bin/playwright" install --with-deps chromium
          export CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          mkdir -p "$RUNNER_TEMP/publication/opencv_imgproc_ada"
          cp -a _site/. "$RUNNER_TEMP/publication/opencv_imgproc_ada/"
          python3 -m http.server 18741 --bind 127.0.0.1 --directory "$RUNNER_TEMP/publication" > "$RUNNER_TEMP/doc-http.log" 2>&1 &
          export DOC_URL=http://127.0.0.1:18741/opencv_imgproc_ada/
          export DOC_PRESENTATION=shared-0.1.1
          export DOC_EVIDENCE="$RUNNER_TEMP/doc-browser-evidence"
          node scripts/test_gnatdoc_guides_browser.cjs
          export DOC_QUALIFICATION="$GITHUB_WORKSPACE/imgproc/obj/docs/shared-qualification.json"
          export CORE_TYPES="$RUNNER_TEMP/core-qualified/referenced-types.json"
          export DOC_OPERATIONS="$RUNNER_TEMP/operations.json"
          "$DOC_PYTHON" scripts/record_production_operations.py --output "$DOC_OPERATIONS"
          export DOC_BROWSER_REPORT="$RUNNER_TEMP/doc-browser-evidence/api-browser.json"
          node scripts/test_shared_production_browser.cjs
      - name: Recheck complete actual upload files and Core deployment after browser campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$DOC_PYTHON" scripts/qualify_current_core.py --core "$GITHUB_WORKSPACE/core" --native "$RUNNER_TEMP/core-native" --output "$RUNNER_TEMP/core-qualified-after"
          "$DOC_PYTHON" scripts/validate_docs.py _site
          python3 scripts/install_released_gnatdoc.py --venv "$GNATDOC_ENHANCER_VENV" --verify > obj/docs/enhancer-final.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ada-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: imgproc/_site/
          if-no-files-found: error
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatdoc-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            imgproc/obj/docs/
            ${{ runner.temp }}/core-qualified/
            ${{ runner.temp }}/core-qualified-after/
            ${{ runner.temp }}/doc-browser-evidence/
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: imgproc/_site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    # Allow fresh tool acquisition/reconstruction, bounded Pages retries and
    # Chromium qualification, but do not occupy a runner for the 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Initialize failure evidence
        run: printf '%s\n' '{"passed":false,"stage":"setup; see job logs"}' > "$RUNNER_TEMP/live-setup.json"
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native reconstruction prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libopencv-dev pkg-config unzip python3
      - name: Install qualified Alire and documentation environment
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          python3 scripts/install_released_gnatdoc.py --venv "$RUNNER_TEMP/enhancer-0.1.1" --with-guides > "$RUNNER_TEMP/enhancer-install.json"
          echo "GNATDOC_ENHANCER_VENV=$RUNNER_TEMP/enhancer-0.1.1" >> "$GITHUB_ENV"
          echo "DOC_PYTHON=$RUNNER_TEMP/enhancer-0.1.1/bin/python" >> "$GITHUB_ENV"
      - name: Reconstruct and verify same-run live publication (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOYMENT_RUN: ${{ github.run_id }}
        run: |
          "$DOC_PYTHON" scripts/verify_live_docs.py \
            --expected-sha "$EXPECTED_SHA" --run-id "$DEPLOYMENT_RUN" \
            --attempts 10 --interval 30 --evidence "$RUNNER_TEMP/live-publication.json" \
            > "$RUNNER_TEMP/live-publication.log" 2>&1
      - name: Qualify live browser navigation and examples
        run: |
          npm install --prefix "$RUNNER_TEMP/doc-browser" playwright@1.64.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/doc-browser/node_modules/playwright"
          "$RUNNER_TEMP/doc-browser/node_modules/.bin/playwright" install --with-deps chromium
          export CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          export DOC_URL=https://zackboll.github.io/opencv_imgproc_ada/
          export DOC_PRESENTATION=shared-0.1.1
          export DOC_EVIDENCE="$RUNNER_TEMP/live-browser"
          node scripts/test_gnatdoc_guides_browser.cjs
      - name: Upload live verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/live-publication.json
            ${{ runner.temp }}/live-publication.log
            ${{ runner.temp }}/live-setup.json
            ${{ runner.temp }}/live-browser/
          if-no-files-found: warn
