name: External AdaCore adapter controls (synthetic, not qualification)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Preserved Debian and isolated external-input negatives
        run: |
          python3 -m unittest discover -s tests -p test_cross_configuration.py -v
          python3 -m unittest discover -s tests -p test_adacore_cross.py -v
          git diff --check