name: Cross-Platform Bridge CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: imgproc

    steps:
      - name: Checkout Imgproc
        uses: actions/checkout@v4
        with:
          path: imgproc

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: main
          path: core

      - name: Verify two-checkout layout and bridge
        run: |
          set -eu
          test -f ../core/cpp/opencv_core_module_bridge.hpp
          echo "Imgproc: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"

      - name: Install OpenCV and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopencv-dev \
            pkg-config

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Report OpenCV
        run: |
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Build Imgproc with Core bridge
        run: alr -n build

      - name: Run Imgproc tests
        run: alr -n -C tests run

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    defaults:
      run:
        working-directory: imgproc

    steps:
      - name: Checkout Imgproc
        uses: actions/checkout@v4
        with:
          path: imgproc

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: main
          path: core

      - name: Verify two-checkout layout and bridge
        run: |
          set -eu
          test -f ../core/cpp/opencv_core_module_bridge.hpp
          echo "Imgproc: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"
          uname -a
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Install Homebrew OpenCV
        run: brew install opencv

      - name: Configure Homebrew pkg-config path
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"
          pkg_path=""
          if [ -d "${brew_pkgconfig}" ]; then
            pkg_path="${brew_pkgconfig}"
          fi
          if [ -d "${opencv_pkgconfig}" ]; then
            pkg_path="${pkg_path:+${pkg_path}:}${opencv_pkgconfig}"
          fi
          if [ -n "${PKG_CONFIG_PATH:-}" ]; then
            pkg_path="${pkg_path:+${pkg_path}:}${PKG_CONFIG_PATH}"
          fi
          echo "PKG_CONFIG_PATH=${pkg_path}" >> "$GITHUB_ENV"

      - name: Report OpenCV and C++ compilers
        run: |
          set -eu
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv
          echo "=== Alire g++ ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true
          echo "=== Apple clang++ ==="
          xcrun --find clang++
          xcrun clang++ --version

      - name: Build Imgproc with Core bridge
        run: alr -n build

      - name: Verify Imgproc shim isolation
        run: |
          set -eu
          shim_dylib=""
          for candidate in lib/libopencv_imgproc_shim.dylib lib/libopencv_imgproc_shim.*.dylib; do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dylib}" ]; then
            echo "error: libopencv_imgproc_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi
          echo "Found: ${shim_dylib}"
          otool -L "${shim_dylib}"
          otool -L "${shim_dylib}" | grep -E 'libopencv_imgproc\.'
          otool -L "${shim_dylib}" | grep -E 'libopencv_core_shim'
          otool -L "${shim_dylib}" | grep -E 'libc\+\+'
          if otool -L "${shim_dylib}" | grep -E 'libstdc\+\+'; then
            echo "error: Imgproc shim dylib depends on libstdc++" >&2
            exit 1
          fi

      - name: Run Imgproc tests
        run: alr -n -C tests run

  windows-x86_64-msys2:
    name: Windows x86_64 (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: imgproc

    steps:
      - name: Checkout Imgproc
        uses: actions/checkout@v4
        with:
          path: imgproc

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: zackboll/opencv_core_ada
          ref: main
          path: core

      - name: Verify two-checkout layout and bridge
        run: |
          set -eu
          test -f ../core/cpp/opencv_core_module_bridge.hpp
          echo "Imgproc: $(git rev-parse HEAD)"
          echo "Core:    $(git -C ../core rev-parse HEAD)"
          uname -a

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true

      - name: Select Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Install MSYS2 OpenCV and C++ toolchain
        run: |
          set -eu
          alr exec -- pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-pkg-config \
            mingw-w64-x86_64-gcc

      - name: Report OpenCV and compiler resolution
        run: |
          set -eu
          echo "=== Target pkg-config ==="
          alr exec -- x86_64-w64-mingw32-pkg-config --modversion opencv5
          echo "=== Generic pkg-config ==="
          command -v pkg-config || true
          where.exe pkg-config || true
          echo "=== Alire g++ ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true
          echo "=== MSYS2 g++ ==="
          alr exec -- sh -c 'ls -l /mingw64/bin/g++.exe && /mingw64/bin/g++.exe --version'

      - name: Build Imgproc with Core bridge
        run: alr -n build

      - name: Run Imgproc tests
        run: alr -n -C tests run